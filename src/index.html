<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"
    />
    <title>タスク＋テキスト</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside>
      <h1>タスク＋テキスト</h1>
      <button id="add">＋タスク追加</button>
      <form id="new-task" hidden>
        <label for="new-title">新しいタスク名</label
        ><input id="new-title" required maxlength="500" />
        <div>
          <button type="submit">追加</button
          ><button id="cancel-add" type="button">キャンセル</button>
        </div>
      </form>
      <label class="sr-only" for="search">タスクを検索</label
      ><input
        id="search"
        type="search"
        placeholder="タスク名・本文を検索"
      /><label class="sr-only" for="filter">状態で絞り込む</label
      ><select id="filter">
        <option value="all">すべて</option>
        <option value="open">未完了</option>
        <option value="done">完了</option>
      </select>
      <div id="list" aria-label="タスク一覧"></div>
    </aside>
    <main>
      <div id="empty">左の「＋タスク追加」から始めましょう。</div>
      <section id="editor" hidden>
        <header>
          <label class="sr-only" for="title">タスク名</label
          ><input id="title" maxlength="500" aria-label="タスク名" /><button
            id="delete"
          >
            削除
          </button>
        </header>
        <p id="dates"></p>
        <label class="sr-only" for="body">タスク本文</label
        ><textarea
          id="body"
          placeholder="このタスクについて自由に書いてください。"
          spellcheck="false"
        ></textarea>
      </section>
      <footer>
        <span id="status" role="status">読み込み中…</span
        ><button id="retry" hidden>保存を再試行</button><span id="path"></span>
      </footer>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
